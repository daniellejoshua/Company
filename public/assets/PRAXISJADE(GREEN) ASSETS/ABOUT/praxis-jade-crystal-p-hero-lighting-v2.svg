<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="t d">
<title id="t">Praxis Jade crystalline P hero</title>
<desc id="d">Editable vector reconstruction of the faceted jade P hero with crystal shards and architectural lines.</desc>
<defs>
  <linearGradient id="leaf" x1="470" y1="170" x2="1120" y2="800" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A7F3DD"/><stop offset=".24" stop-color="#45D3AD"/>
    <stop offset=".58" stop-color="#0AA27C"/><stop offset="1" stop-color="#004A3D"/>
  </linearGradient>
  <linearGradient id="dark" x1="690" y1="360" x2="760" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#031D1A"/><stop offset=".48" stop-color="#002B25"/><stop offset="1" stop-color="#0A6753"/>
  </linearGradient>
  <linearGradient id="mint" x1="720" y1="430" x2="920" y2="650" gradientUnits="userSpaceOnUse">
    <stop stop-color="#D8FFF3"/><stop offset=".42" stop-color="#55D9B5"/><stop offset="1" stop-color="#009A78"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E9FFF9" stop-opacity=".78"/><stop offset=".55" stop-color="#60D7B7" stop-opacity=".32"/>
    <stop offset="1" stop-color="#008E70" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="crystal" x1="820" y1="600" x2="1210" y2="1010" gradientUnits="userSpaceOnUse">
    <stop stop-color="#B7F6E2"/><stop offset=".32" stop-color="#2AC39C"/>
    <stop offset=".68" stop-color="#08725B"/><stop offset="1" stop-color="#02372F"/>
  </linearGradient>
  <radialGradient id="gloss" cx=".28" cy=".16" r=".82">
    <stop stop-color="#F2FFFB" stop-opacity=".85"/><stop offset=".18" stop-color="#9AEBD1" stop-opacity=".55"/>
    <stop offset=".68" stop-color="#0B9B77" stop-opacity=".05"/><stop offset="1" stop-color="#003E34" stop-opacity=".22"/>
  </radialGradient>
  <clipPath id="leafClip">
    <path d="M520 575C516 373 610 221 780 160L1134 68V354C1134 570 1034 708 850 760L682 809 530 944Z"/>
  </clipPath>

  <linearGradient id="rimLight" x1="530" y1="180" x2="1070" y2="720" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity=".92"/>
    <stop offset=".22" stop-color="#C8FFF0" stop-opacity=".62"/>
    <stop offset=".62" stop-color="#5BE0BB" stop-opacity=".18"/>
    <stop offset="1" stop-color="#0A6E59" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="hotspot" cx=".32" cy=".22" r=".62">
    <stop stop-color="#FFFFFF" stop-opacity=".88"/>
    <stop offset=".12" stop-color="#D9FFF4" stop-opacity=".72"/>
    <stop offset=".38" stop-color="#7CE5C6" stop-opacity=".24"/>
    <stop offset="1" stop-color="#7CE5C6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pReflect" x1="0" y1="0" x2=".72" y2="1">
    <stop stop-color="#031A17" stop-opacity="0"/>
    <stop offset=".52" stop-color="#0A4D40" stop-opacity=".2"/>
    <stop offset="1" stop-color="#51C9A7" stop-opacity=".48"/>
  </linearGradient>
  <linearGradient id="orbRefraction" x1=".18" y1=".1" x2=".85" y2=".9">
    <stop stop-color="#F0FFF9" stop-opacity=".8"/>
    <stop offset=".3" stop-color="#9BECD3" stop-opacity=".32"/>
    <stop offset=".31" stop-color="#2CC39B" stop-opacity=".08"/>
    <stop offset=".67" stop-color="#006B57" stop-opacity=".32"/>
    <stop offset=".68" stop-color="#B8F5E2" stop-opacity=".24"/>
    <stop offset="1" stop-color="#00745C" stop-opacity=".08"/>
  </linearGradient>
  <filter id="jadeBloom" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <filter id="tinyBloom" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>

</defs>

<!-- supporting glass shards -->
<g opacity=".72">
 <path d="M154 601L543 381 392 764Z" fill="url(#glass)"/>
 <path d="M295 583L526 481 366 798Z" fill="#A9EED9" opacity=".36"/>
 <path d="M1135 72L1301 8 1291 403 1134 354Z" fill="#74DDBE" opacity=".19"/>
 <path d="M1136 355L1394 307 1248 574Z" fill="url(#glass)" opacity=".6"/>
 <path d="M1237 464L1392 309 1320 551Z" fill="#0A9474" opacity=".18"/>
</g>

<!-- architectural lines -->
<g fill="none" stroke-linecap="round">
 <path d="M154 600L714 286 1473 61" stroke="#06A987" stroke-width="2"/>
 <path d="M296 584L424 978" stroke="#14B594" stroke-width="1.5"/>
 <path d="M1134 355L1474 62" stroke="#10A989" stroke-width="1.5"/>
 <path d="M1290 132V403" stroke="#0BAA87" stroke-width="2"/>
 <path d="M1110 584L1433 933" stroke="#0BAA87" stroke-width="1.5"/>
</g>

<!-- main leaf -->
<path d="M520 575C516 373 610 221 780 160L1134 68V354C1134 570 1034 708 850 760L682 809 530 944Z" fill="url(#leaf)"/>
<g clip-path="url(#leaf)">
 <path d="M516 579L780 160 716 531Z" fill="#8EE8CB" opacity=".7"/>
 <path d="M780 160L1134 68 952 403Z" fill="#1EB68D" opacity=".65"/>
 <path d="M716 531L952 403 850 760Z" fill="#008D6E" opacity=".55"/>
 <path d="M952 403L1134 68 1134 354 850 760Z" fill="#006451" opacity=".64"/>
 <path d="M530 944L516 579 716 531 682 809Z" fill="#006A56" opacity=".72"/>
 <path d="M682 809L716 531 850 760Z" fill="#005647" opacity=".58"/>
 <path d="M507 152H1154V781H507Z" fill="url(#gloss)" opacity=".72"/>
 <path d="M541 577L790 175" stroke="#E6FFF7" stroke-width="4" opacity=".72"/>
 <path d="M789 175L1129 128" stroke="#C7F8E9" stroke-width="3" opacity=".65"/>
 <path d="M1129 128L842 739" stroke="#50D5AF" stroke-width="2" opacity=".55"/>
</g>

<!-- P stem and ring -->
<path d="M682 944V563C682 453 758 378 864 378 970 378 1031 446 1031 544 1031 645 957 713 852 713H814V809L682 944Z" fill="url(#dark)"/>
<path d="M864 378C970 378 1031 446 1031 544 1031 645 957 713 852 713 749 713 682 645 682 548 682 450 758 378 864 378Z" fill="#031C19"/>
<circle cx="861" cy="544" r="98" fill="url(#mint)"/>
<path d="M783 574L875 474 948 543 849 642Z" fill="#C4F8E8" opacity=".38"/>
<path d="M875 474L948 543 861 642Z" fill="#0AA17D" opacity=".55"/>
<path d="M698 727L815 675 815 808 682 944Z" fill="#1B8B70" opacity=".3"/>


<!-- optical lighting overlays: preserve silhouette, add jade/glass material -->
<g pointer-events="none">
  <!-- localized mint-white illumination on upper-left leaf -->
  <ellipse cx="692" cy="282" rx="300" ry="215" fill="url(#hotspot)" opacity=".62"
           clip-path="url(#leafClip)" filter="url(#jadeBloom)"/>
  <!-- crisp curved rim light -->
  <path d="M540 574C540 380 623 250 786 188C900 145 1015 117 1122 92"
        fill="none" stroke="url(#rimLight)" stroke-width="7" stroke-linecap="round" opacity=".74"/>
  <path d="M552 565C567 392 645 280 790 219"
        fill="none" stroke="#F4FFFB" stroke-width="2.2" stroke-linecap="round" opacity=".78"/>
  <!-- right-side emerald falloff facets -->
  <path d="M952 403L1134 68V354C1134 570 1034 708 850 760Z"
        fill="#003F35" opacity=".18" clip-path="url(#leafClip)"/>
  <path d="M948 404L1119 129L1054 515L850 760Z"
        fill="#007B61" opacity=".2" clip-path="url(#leafClip)"/>
  <!-- internal glass reflection -->
  <path d="M579 503L788 184L716 531L641 677Z"
        fill="#D7FFF2" opacity=".15" clip-path="url(#leafClip)"/>
  <path d="M790 181L1117 126L951 402Z"
        fill="#B8F5E2" opacity=".11" clip-path="url(#leafClip)"/>

  <!-- jade reflected light over the dark P -->
  <path d="M682 944V563C682 453 758 378 864 378C970 378 1031 446 1031 544
           C1031 645 957 713 852 713H814V809Z"
        fill="url(#pReflect)" opacity=".72"/>

  <!-- glass orb refraction -->
  <circle cx="861" cy="544" r="98" fill="url(#orbRefraction)" opacity=".9"/>
  <path d="M786 567L870 475L947 541L858 635Z" fill="#E7FFF7" opacity=".18"/>
  <path d="M798 501C830 458 892 438 931 477"
        fill="none" stroke="#F4FFFB" stroke-width="4" opacity=".62" filter="url(#tinyBloom)"/>

  <!-- crystal edge catches -->
  <path d="M851 707L1111 583L1007 1011" fill="none" stroke="#DFFFF5" stroke-width="2.2" opacity=".55"/>
  <path d="M1111 583L1260 1011" fill="none" stroke="#A6F0DA" stroke-width="2" opacity=".48"/>
  <path d="M684 1011L851 707L902 1011" fill="none" stroke="#E6FFF7" stroke-width="1.8" opacity=".45"/>
</g>

<!-- lower crystal cluster -->
<g>
 <path d="M684 1011L851 707 902 1011Z" fill="url(#crystal)"/>
 <path d="M851 707L1007 1011H902Z" fill="#08735C"/>
 <path d="M851 707L1111 583 1007 1011Z" fill="#A3EFDA" opacity=".74"/>
 <path d="M1111 583L1131 1011H1007Z" fill="#005847"/>
 <path d="M1111 583L1260 1011H1131Z" fill="url(#crystal)"/>
 <path d="M1131 1011L1260 1011 1198 839Z" fill="#075746"/>
 <path d="M902 1011L960 760 1007 1011Z" fill="#56D5B2" opacity=".7"/>
 <path d="M1007 1011L1111 583 1131 1011Z" fill="#00745B" opacity=".52"/>
 <path d="M1131 1011L1198 839 1260 1011Z" fill="#21A987" opacity=".56"/>
 <path d="M612 1011L684 832 731 1011Z" fill="#B8F4E2" opacity=".5"/>
</g>

<!-- facet separators/highlights -->
<g fill="none" stroke="#E2FFF6" stroke-width="1.5" opacity=".65">
 <path d="M851 707L902 1011"/><path d="M851 707L1007 1011"/>
 <path d="M1111 583L1007 1011"/><path d="M1111 583L1131 1011"/>
</g>
</svg>