<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460">
<defs>
 <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#7AE1BC"/><stop offset=".52" stop-color="#2EBD91"/><stop offset="1" stop-color="#0C8969"/></linearGradient>
