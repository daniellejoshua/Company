>
  <defs>
    <linearGradient
      id="jadeGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#16B88A"/>
      <stop offset="100%" stop-color="#004D40"/>
